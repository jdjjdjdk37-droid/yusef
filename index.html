<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>يوسف البقلي | روابط التواصل</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 40px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeInUp 0.6s ease;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 16px;
      object-fit: cover;
      border: 3px solid #333;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    
    .bio {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    
    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid #2a2a2a;
      background: #141414;
      text-decoration: none;
      color: #fff;
      margin-bottom: 12px;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    
    .link-btn:hover {
      background: #222;
      border-color: #444;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    .link-btn:active {
      transform: translateY(0);
    }
    
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .telegram { background: #0088cc; }
    .tiktok { background: #000; border: 1px solid #333; }
    .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    
    .info { text-align: right; flex: 1; }
    .info .title { font-size: 15px; font-weight: 600; }
    .info .handle { font-size: 12px; color: #777; margin-top: 2px; }
    
    .arrow {
      color: #555;
      transition: color 0.2s;
    }
    .link-btn:hover .arrow { color: #fff; }
    
    .footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #2a2a2a;
      font-size: 11px;
      color: #555;
    }
    
    @media (max-width: 480px) {
      .card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- الصورة من ملف منفصل بنفس المجلد -->
    <img class="avatar" src="avatar.jpg" alt="يوسف البقلي">
    <h1>يوسف البقلي</h1>
    <p class="bio">وَأهجُر مايُؤذيكَ ولا تَلتَفِت</p>

        </svg>
      </div>
      <div class="info">
        <div class="title">تيليجرام</div>
        <div class="handle">@tn3_8</div>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17L17 7"/><path d="M7 7h10v10"/>

    <!-- تيك توك -->

        </svg>

      <div class="info">

      <div class="icon-box instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
        </svg>
      </div>
      <div class="info">
        <div class="title">انستغرام</div>
        <div class="handle">@kkq6</div>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17L17 7"/><path d="M7 7h10v10"/>
      </svg>
    </a>

    <div class="footer">جميع الروابط محدثة</div>
  </div>

  <script>
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        this.style.transform = 'scale(0.97)';
        setTimeout(() => this.style.transform = '', 150);
      });
    });
  </script>

</body>
</html>
